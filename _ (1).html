<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery" data-title="Gallery">
  <div id="header"></div>
  <main class="wrap page">
    <h1>Gallery</h1>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search a place or tag, e.g. temple, flower, BTS" aria-label="Search photos">
      <p id="count" class="count"></p>
    </div>
    <div id="pills" class="pills"></div>
    <div id="tags" class="pills"></div>
    <div id="grid" class="masonry"></div>
    <p id="empty" class="notice" hidden>No photos match your search.</p>
  </main>
  <div id="footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
